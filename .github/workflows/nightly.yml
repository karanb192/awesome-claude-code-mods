name: nightly scan

# The 22:30 run is the full GitHub code search. The three-hourly runs rescan known candidates
# and seeds, plus repositories pushed since the last scan that repository search finds. Seed
# additions publish separately (publish-seeds.yml) without waiting for either.
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "0 1-19/3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open a pull request even when only stars and timestamps moved"
        type: boolean
        default: false
      crawl:
        description: "Run the full GitHub code search"
        type: boolean
        default: false
  pull_request:
    paths: ["tools/**", "data/seeds.txt", "package.json", "package-lock.json", ".github/workflows/nightly.yml", ".github/workflows/weekly-retirement.yml", ".github/workflows/publish-seeds.yml"]

permissions:
  contents: write
  pull-requests: write

# One scan at a time: scheduled and manual runs share the search token and the scan branch, and
# two searches in the same minute rate-limit each other into hints of ten minutes and more. Pull
# request checks get a group per PR, so a queued check is not cancelled by the next scan.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('scan-pr-{0}', github.event.pull_request.number) || 'scan' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - name: Choose the discovery mode
        id: mode
        if: github.event_name != 'pull_request'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CRAWL: ${{ inputs.crawl }}
        run: |
          if [ "$SCHEDULE" = "30 22 * * *" ] || [ "$CRAWL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "args=--recent --keep-on-failure" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "args=--recent --skip-code-search" >> "$GITHUB_OUTPUT"
          fi
      # Discovery progress waits in the open scan PR until it is merged; the cache hands it to the next run.
      - name: Restore discovery progress from the last run
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/discovery
          key: discovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-
      # PRs include submitted seeds without spending the global search rate limit.
      - name: Discover candidates
        id: discover
        if: github.event_name != 'pull_request'
        run: node tools/discover.mjs ${{ steps.mode.outputs.args }} --restore "$RUNNER_TEMP/discovery/discovery.json" --note "$RUNNER_TEMP/discovery.txt"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage discovery progress for the next run
        if: steps.discover.outcome == 'success'
        run: mkdir -p "$RUNNER_TEMP/discovery" && cp data/discovery.json "$RUNNER_TEMP/discovery/discovery.json"
      - name: Save discovery progress for the next run
        if: steps.discover.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/discovery
          key: discovery-${{ github.run_id }}-${{ github.run_attempt }}
      # A pull request that only adds seeds scans those seeds; publication validates them again
      # after the merge. Tooling changes still rescan every committed candidate.
      - name: Choose the pull request scan scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$PR_BASE" HEAD | grep -qE '^(tools/|package\.json|package-lock\.json|\.github/)'; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--seeds-only" >> "$GITHUB_OUTPUT"
          fi
      - run: node tools/candidates.mjs --base "$PR_BASE" ${{ steps.scope.outputs.args }}
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run scan -- --repos data/pr-repos.txt --required data/pr-required.txt
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run scan
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run render
      - run: npm run lint
      - name: Decide whether the change is worth a pull request
        id: worth
        if: github.event_name != 'pull_request'
        run: |
          set +e
          node tools/changed.mjs > change.txt
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            cat change.txt || true
            echo "The scan looks partial; failing instead of opening a pull request." >&2
            exit 1
          elif [ "$rc" = "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ] || { [ "${{ steps.mode.outputs.mode }}" = "full" ] && [ "$(date -u +%u)" = "7" ]; }; then
            echo "weekly refresh: stars and timestamps only" > change.txt
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            git checkout -- .
          fi
          cat change.txt || true
          {
            echo "Automated discovery and rescan against the current Claude Code release. Known candidates are retained; missing plugins remain unverified until the weekly retirement review. Review catalogue.md and data/mods.json before merging."
            echo
            echo "## Discovery"
            echo
            cat "$RUNNER_TEMP/discovery.txt" 2>/dev/null || true
            echo
            echo "## Changes"
            echo
            head -n 300 change.txt | sed 's/^/- /'
            if [ "$(wc -l < change.txt)" -gt 300 ]; then echo; echo "The full list is in the workflow log."; fi
          } > "$RUNNER_TEMP/pr-body.md"
          rm -f change.txt
      - name: Open or update the scan pull request
        if: github.event_name != 'pull_request' && steps.worth.outputs.open == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nightly-scan
          title: "Scan: refresh footprints and badges"
          commit-message: "Scan: refresh footprints and badges"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: scan
