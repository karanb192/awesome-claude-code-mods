name: nightly scan

# The 22:30 run is the full GitHub code search. The three-hourly runs rescan known candidates
# and seeds, plus repositories pushed since the last scan that repository search finds. Seed
# additions publish separately (publish-seeds.yml) without waiting for either.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [publish approved seeds]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 22 * * *"
    - cron: "0 1-19/3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open a pull request even when only stars and timestamps moved"
        type: boolean
        default: false
      crawl:
        description: "Run the full GitHub code search"
        type: boolean
        default: false
  pull_request:
    paths: ["tools/**", "data/seeds.txt", "data/duplicates.txt", "data/catalogs.txt", "data/fixture-exceptions.txt", "package.json", "package-lock.json", ".github/workflows/nightly.yml", ".github/workflows/weekly-retirement.yml", ".github/workflows/publish-seeds.yml"]

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name == 'push' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    concurrency:
      group: scan
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether the pending scan needs a refresh
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-scan.sh --check
      - run: npm ci
        if: steps.pending.outputs.pending == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.pending.outputs.pending == 'true'
      - name: Refresh the pending scan against main without rescanning
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-scan.sh --refresh
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: scan-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps: &scan_steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - name: Choose the discovery mode
        id: mode
        if: github.event_name != 'pull_request'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CRAWL: ${{ inputs.crawl }}
        run: |
          if [ "$SCHEDULE" = "30 22 * * *" ] || [ "$CRAWL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "args=--recent --keep-on-failure" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "args=--recent --skip-code-search" >> "$GITHUB_OUTPUT"
          fi
      # Discovery progress waits in the open scan PR until it is merged; the cache hands it to the next run.
      - name: Restore discovery progress from the last run
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/discovery
          key: discovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-
      # PRs include submitted seeds without spending the global search rate limit.
      - name: Discover candidates
        id: discover
        if: github.event_name != 'pull_request'
        run: node tools/discover.mjs ${{ steps.mode.outputs.args }} --restore "$RUNNER_TEMP/discovery/discovery.json" --note "$RUNNER_TEMP/discovery.txt"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage discovery progress for the next run
        if: steps.discover.outcome == 'success'
        run: mkdir -p "$RUNNER_TEMP/discovery" && cp data/discovery.json "$RUNNER_TEMP/discovery/discovery.json"
      - name: Save discovery progress for the next run
        if: steps.discover.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/discovery
          key: discovery-${{ github.run_id }}-${{ github.run_attempt }}
      # A pull request that only adds seeds scans those seeds; publication validates them again
      # after the merge. Tooling changes still rescan every committed candidate.
      - name: Choose the pull request scan scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$PR_BASE" HEAD | grep -qE '^(tools/|package\.json|package-lock\.json|\.github/|data/(duplicates|catalogs|fixture-exceptions)\.txt)'; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--seeds-only" >> "$GITHUB_OUTPUT"
          fi
      - run: node tools/candidates.mjs --base "$PR_BASE" ${{ steps.scope.outputs.args }}
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run scan -- --repos data/pr-repos.txt --required data/pr-required.txt
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run scan
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run render
        if: github.event_name == 'pull_request'
      - run: npm run lint
        if: github.event_name == 'pull_request'
      - name: Publish the completed scan against current main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          export SCAN_FORCE="$FORCE"
          if [ "$MODE" = full ] && [ "$(date -u +%u)" = 7 ]; then export SCAN_FORCE=true; fi
          bash tools/publish-scan.sh
  discover:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: scan
      queue: max
    steps: *scan_steps
